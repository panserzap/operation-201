[project]
name = "operation-201"
version = "0.1.0"
description = "A FastAPI backend for part traceability and visual defect inspection."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    {name = "Panos Zap"}
]
dependencies = [
    "fastapi>=0.140",
    "uvicorn[standard]>=0.30",
]


[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"